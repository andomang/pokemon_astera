<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>포켓몬스터 아스테라 — 브라우저 팬게임 플레이 | domang</title>
  <!-- 검색 결과 설명 (없으면 구글이 오른쪽 설정 패널 글자를 설명으로 가져다 씀) -->
  <meta name="description" content="신대륙 아스테라를 무대로 한 오리지널 스토리 팬게임을 브라우저에서 바로 플레이하세요. 설치 없이 PC·모바일에서, 진행 기록은 domang 계정에 저장됩니다.">
  <link rel="canonical" href="https://domang.org/pokemon">
  <meta property="og:title" content="포켓몬스터 아스테라 — 브라우저 팬게임">
  <meta property="og:description" content="신대륙 아스테라를 무대로 한 오리지널 스토리 팬게임. 설치 없이 브라우저에서 바로 플레이.">
  <meta property="og:image" content="https://domang.org/img/og/pokemon.jpg">
  <meta property="og:url" content="https://domang.org/pokemon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a12; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Malgun Gothic', sans-serif; }
    #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 40px rgba(80, 120, 255, 0.25); }
    #name-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); z-index: 40; } /* 모바일 패드(12)·설정 패널(15~25)보다 위 */
    #name-box { background: #f8f8f8; border: 4px solid #4a6aa8; border-radius: 10px; padding: 20px 24px; min-width: 300px; text-align: center; }
    #name-title { font-size: 20px; margin-bottom: 14px; color: #333; }
    #name-input { font-size: 22px; padding: 6px 10px; width: 220px; border: 2px solid #8aa; border-radius: 6px; text-align: center; }
    #name-ok { margin-left: 8px; font-size: 18px; padding: 6px 14px; border-radius: 6px; border: 0; background: #4a6aa8; color: #fff; cursor: pointer; }
    #hint { position: fixed; bottom: 6px; left: 0; right: 300px; text-align: center; color: #556; font-size: 12px; pointer-events: none; }
    body { justify-content: flex-start; padding-right: 300px; }
    #screen { margin: 0 auto; }
    #side { position: fixed; top: 0; right: 0; width: 300px; height: 100%; overflow-y: auto; background: #12162a; color: #dde; border-left: 2px solid #2a3560; padding: 12px 14px; font-size: 13px; box-sizing: border-box; }
    #side a.home { display: inline-block; margin-bottom: 10px; color: #9fb4ff; font-size: 13px; font-weight: bold; text-decoration: none; }
    #side a.home:hover { color: #fff; text-decoration: underline; }
    #side h2 { font-size: 18px; color: #f8d030; margin-bottom: 8px; }
    #side h3 { font-size: 14px; color: #9fb4ff; margin: 2px 0 8px; display: flex; justify-content: space-between; align-items: center; }
    #side section { background: #1a2040; border: 1px solid #2a3560; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    #side input:not([type]), #side input[type=password], #side select { width: 100%; margin: 3px 0; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a4a80; background: #0d1124; color: #fff; box-sizing: border-box; }
    #side label { display: block; margin: 5px 0; color: #bcc; }
    #side label.chk { display: flex; gap: 6px; align-items: center; }
    #side input[type=range] { width: 100%; }
    #side button, #admin button { background: #3a4fa0; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    #side button:hover, #admin button:hover { filter: brightness(1.2); }
    button.sm { padding: 3px 8px !important; font-size: 12px !important; background: #2c3870 !important; }
    button.wide { width: 100%; margin-top: 8px; }
    button.gold { background: #c08a10 !important; }
    button.danger { background: #a03030 !important; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
    .row b { flex: 1; }
    .badge { background: #c08a10; color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
    .muted { color: #8890b0; font-size: 12px; margin-top: 4px; }
    .err { color: #ff7070; font-size: 12px; min-height: 14px; }
    .seg { display: flex; gap: 4px; } .seg button { flex: 1; background: #2c3870; } .seg button.on, .tabs button.on { background: #e05030 !important; }
    table.keys { width: 100%; border-collapse: collapse; } table.keys td { padding: 3px 2px; border-bottom: 1px solid #2a3560; } table.keys td:nth-child(2) { color: #f8d030; }
    #toast { position: fixed; top: 16px; left: calc(50% - 150px); transform: translateX(-50%); background: rgba(20,30,70,0.92); color: #fff; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; font-size: 14px; }
    #admin { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 20; }
    #admin .modal { width: 560px; max-width: 94vw; max-height: 90vh; overflow-y: auto; background: #151a33; color: #dde; border: 2px solid #c08a10; border-radius: 12px; padding: 14px 18px; font-size: 14px; }
    #admin .mh { display: flex; justify-content: space-between; align-items: center; font-size: 17px; color: #f8d030; margin-bottom: 8px; }
    #admin .tabs { display: flex; gap: 4px; margin-bottom: 10px; } #admin .tabs button { flex: 1; background: #2c3870; }
    #admin label { display: block; margin: 6px 0; } #admin label.chk { display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; }
    #admin input:not([type=checkbox]), #admin select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a4a80; background: #0d1124; color: #fff; box-sizing: border-box; }
    #admin .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; align-items: end; }
    #admin .mb > button { margin-top: 8px; }
    html, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #screen, #touch { touch-action: none; }
    body.mobile { padding-right: 0; align-items: flex-start; padding-top: 8px; }
    body.mobile #hint { display: none; }
    body.mobile #side { display: none; width: min(340px, 92vw); z-index: 15; box-shadow: -6px 0 20px rgba(0,0,0,.6); }
    body.mobile.show-side #side { display: block; }
    body.mobile #side input, body.mobile #side select, body.mobile #admin input, body.mobile #admin select { font-size: 16px; }
    #touch .tc-group { position: fixed; z-index: 12; display: flex; flex-direction: column; align-items: center; }
    #touch .tc-handle { font-size: 16px; color: rgba(255,255,255,.55); padding: 0 14px; line-height: 18px; background: rgba(0,0,0,.25); border-radius: 8px 8px 0 0; touch-action: none; }
    body.tc-editing #touch .tc-group { outline: 2px dashed #f8d030; outline-offset: 4px; border-radius: 12px; }
    #touch .pad { width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); position: relative; }
    #touch .pad::before { content: '▲\A◀　　▶\A▼'; white-space: pre; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: rgba(255,255,255,.35); font-size: 18px; line-height: 40px; }
    #touch .knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(255,255,255,.45); border: 2px solid rgba(255,255,255,.7); }
    #touch .btns { position: relative; width: 170px; height: 160px; }
    #touch button { position: absolute; border: 2px solid rgba(255,255,255,.6); color: #fff; font-weight: bold; touch-action: none; }
    #touch .btns .a { width: 72px; height: 72px; border-radius: 50%; right: 4px; top: 20px; background: rgba(224,64,64,.6); font-size: 24px; }
    #touch .btns .b { width: 62px; height: 62px; border-radius: 50%; right: 84px; top: 70px; background: rgba(64,96,224,.6); font-size: 22px; }
    #touch .btns .r { width: 70px; height: 32px; border-radius: 16px; right: 4px; top: 118px; background: rgba(80,80,80,.6); font-size: 13px; }
    #touch button.on { filter: brightness(1.6); transform: scale(.94); }
    #touch .sys { display: flex; gap: 4px; background: rgba(0,0,0,.25); padding: 4px; border-radius: 0 0 10px 10px; }
    #touch .sys button { position: static; padding: 6px 9px; border-radius: 8px; background: rgba(40,50,90,.7); font-size: 13px; }
    /* 첫 로딩 화면 (게임 스크립트보다 먼저 보임) */
    #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0a0a12; color: #dde; font-family: 'Malgun Gothic', sans-serif; transition: opacity .4s; }
    #boot b { font-size: 22px; color: #f8d030; letter-spacing: 1px; }
    #boot .bar { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: #1d2440; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 35%; border-radius: 3px; background: linear-gradient(90deg, #e05030, #f8d030); animation: bootbar 1.1s ease-in-out infinite; }
    @keyframes bootbar { 0% { transform: translateX(-110%); } 100% { transform: translateX(310%); } }
    #boot small { color: #8890b0; font-size: 13px; min-height: 18px; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>
  <canvas id="screen" width="512" height="384"></canvas>
  <div id="name-overlay"><div id="name-box"><div id="name-title">이름</div><input id="name-input" autocomplete="off"><button id="name-ok">확인</button></div></div>
  <!-- 첫 로딩 화면: 타이틀이 뜨면 사라짐 -->
  <div id="boot"><b>포켓몬스터 아스테라</b><div class="bar"><i></i></div><small id="boot-msg">게임 데이터를 받는 중...</small></div>
  <script>
    // 진행 단계 표시 + 타이틀(첫 화면)이 뜨면 로딩 화면 숨김. 10초가 넘으면 새로고침 안내
    (function () {
      var t0 = Date.now(), msg = document.getElementById('boot-msg'), box = document.getElementById('boot');
      var iv = setInterval(function () {
        var ready = typeof Game !== 'undefined';
        if (ready && Game.scene) { box.style.opacity = '0'; setTimeout(function () { box.remove(); }, 450); clearInterval(iv); return; }
        msg.textContent = ready ? '글꼴과 그림을 준비하는 중...' : '게임 데이터를 받는 중...';
        if (Date.now() - t0 > 10000) msg.textContent += '  (오래 걸리면 새로고침해 주세요)';
      }, 150);
    })();
  </script>
  <div id="hint">방향키 이동 · Shift 달리기 · Z/Enter 결정 · X/Esc 메뉴·취소</div>

  <!-- 어나더레드 데이터에서 추출한 데이터 -->
  <script src="game/gamedata.js"></script>
  <!-- 영어로 남아 있던 이름·설명 한국어화 -->
  <script src="game/ko.js"></script>
  <script src="game/ko_moves.js"></script>
  <script src="game/ko_misc.js"></script>
  <script src="game/tilesets.js"></script>
  <script src="game/interiors.js"></script>
  <!-- 엔진 -->
  <script src="game/core.js"></script>
  <script src="game/tilemap.js"></script>
  <script src="game/world.js"></script>
  <script src="game/worldgen.js"></script>
  <script src="game/mon.js"></script>
  <script src="game/battle.js"></script>
  <script src="game/gimmick.js"></script>
  <script src="game/ui.js"></script>
  <script src="game/ability.js"></script>
  <script src="game/main.js"></script>
  <script src="game/story.js"></script>
  <script src="game/story2.js"></script>
  <!-- 원작 진화 조건 (친밀도·기술·지닌 도구·걸음 수·지역 폼 등) -->
  <script src="game/evolution.js"></script>
  <!-- 랜드마크: 별빛시티 천문대 / 산호항구 등대 (맵 확장 + 건물 안 이벤트) -->
  <script src="game/landmarks.js"></script>
  <!-- 퀘스트(메인/서브/활동) + 화면 목표 알림 + 지도 전체 공개 -->
  <script src="game/quests.js"></script>
  <!-- 마을 꾸미기(콘셉트별 장식 자동 배치) + 지역 소개 카드 -->
  <script src="game/xtiles.js"></script>
  <script src="game/places.js"></script>
  <!-- 필드 전설·레이드 둥지 위치 보정 (건물/나무/서로 겹침 방지) -->
  <script src="game/legendfix.js"></script>
  <!-- 변신 폼(도구·특성·울트라버스트·무한다이맥스) / 시공 포탈(패러독스 포켓몬): legendfix 다음 -->
  <script src="game/forms.js"></script>
  <script src="game/portal.js"></script>
  <!-- 이로치 연출 (반짝임, 이름 옆 ★) -->
  <script src="game/shiny.js"></script>
  <!-- 따라다니는 포켓몬: 파티 1번 추적 + 그림 없는 포켓몬도 보이게 -->
  <script src="game/follower.js"></script>
  <!-- 다음 맵 그림 미리 받기 -->
  <script src="game/prefetch.js"></script>
  <script src="game/panel.js"></script>
  <!-- domang.org 서버 연동 (서버에서 열 때만 동작, 로컬 실행에는 영향 없음) -->
  <script src="game/server.js"></script>
  <!-- 이상한 소포 (포켓몬센터 배달원) -->
  <script src="game/parcels.js"></script>
  <!-- 관리자 치트 (관리자 계정만) / 전체화면 -->
  <script src="game/admin.js"></script>
  <!-- 관리자 포켓몬 검색 선택기 + 치트 켜짐 표시 -->
  <script src="game/adminpick.js"></script>
  <script src="game/display.js"></script>
  <script src="game/touch.js"></script>
  <script src="game/dev.js"></script>
</body>
</html>
